name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, plex-local-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify release metadata
        run: node scripts/check-release-metadata.js "$GITHUB_REF_NAME"
      - name: Verify physical-TV release signoff
        run: node scripts/check-release-signoff.js "$GITHUB_REF_NAME"
      - name: Install verification tools
        run: npm ci
      - name: Audit high and critical dependency vulnerabilities
        run: npm run check:deps
      - name: Run lint, type checks, tests, and repository checks
        run: npm run verify

  package-ipk:
    needs: verify
    runs-on: [self-hosted, Linux, X64, plex-local-build]
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Install build dependencies
        run: npm ci
      - name: Install webOS CLI
        run: npm install --global @webos-tools/cli@3.2.5
      - name: Build and inspect generic IPK
        run: |
          ./scripts/package-tv-shell.sh
          ./scripts/inspect-ipk.sh
      - name: Resolve packaged IPK
        run: |
          APP_ID=$(node -p "require('./webos-shell-app/appinfo.json').id")
          APP_VERSION=$(node -p "require('./webos-shell-app/appinfo.json').version")
          PACKAGE="dist/${APP_ID}_${APP_VERSION}_all.ipk"
          test -f "$PACKAGE"
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
      - name: Extract packaged payload for SBOM
        run: |
          SBOM_ROOT=$(mktemp -d "$RUNNER_TEMP/ploff-ipk-sbom.XXXXXX")
          ar -p "$PACKAGE" data.tar.gz | tar -xzf - -C "$SBOM_ROOT"
          echo "SBOM_ROOT=$SBOM_ROOT" >> "$GITHUB_ENV"
      - name: Generate SPDX SBOM for packaged payload
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ env.SBOM_ROOT }}
          format: spdx-json
          output-file: dist/SBOM.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest IPK build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.PACKAGE }}
      - name: Attest IPK SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.PACKAGE }}
          sbom-path: dist/SBOM.spdx.json
      - name: Prepare release assets
        run: |
          PACKAGE_NAME=$(basename "$PACKAGE")
          test -f dist/SBOM.spdx.json
          (cd dist && sha256sum "$PACKAGE_NAME" SBOM.spdx.json) > SHA256SUMS
          node scripts/extract-release-notes.js "$GITHUB_REF_NAME" > RELEASE_NOTES.md
          printf '\n---\nVerified release. Includes the generic IPK, SHA-256 checksums, SPDX SBOM, and GitHub artifact attestations.\n' >> RELEASE_NOTES.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$PACKAGE" SHA256SUMS dist/SBOM.spdx.json --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --notes-file RELEASE_NOTES.md \
              --title "Ploff $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" "$PACKAGE" SHA256SUMS dist/SBOM.spdx.json \
              --notes-file RELEASE_NOTES.md \
              --title "Ploff $GITHUB_REF_NAME"
          fi

  publish-image:
    needs: verify
    runs-on: [self-hosted, Linux, X64, plex-local-build]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Verify release metadata
        run: node scripts/check-release-metadata.js "$GITHUB_REF_NAME"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/ploff-webos-installer
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Attest published container provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/ploff-webos-installer
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
