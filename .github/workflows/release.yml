name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify version tag
        run: |
          APP_VERSION=$(node -p "require('./webos-shell-app/appinfo.json').version")
          test "$GITHUB_REF_NAME" = "v$APP_VERSION"
      - name: Verify physical-TV release signoff
        run: node scripts/check-release-signoff.js "$GITHUB_REF_NAME"
      - name: Install verification tools
        run: npm ci
      - name: Audit high and critical dependency vulnerabilities
        run: npm run check:deps
      - name: Run lint, type checks, tests, and repository checks
        run: npm run verify

  package-ipk:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Install packaging dependencies
        run: npm ci
      - name: Install webOS CLI
        run: npm install --global @webos-tools/cli@3.2.5
      - name: Build and inspect generic IPK
        run: |
          ./scripts/package-tv-shell.sh
          ./scripts/inspect-ipk.sh
      - name: Prepare release assets
        run: |
          APP_ID=$(node -p "require('./webos-shell-app/appinfo.json').id")
          APP_VERSION=$(node -p "require('./webos-shell-app/appinfo.json').version")
          PACKAGE="dist/${APP_ID}_${APP_VERSION}_all.ipk"
          PACKAGE_NAME=$(basename "$PACKAGE")
          test -f "$PACKAGE"
          (cd dist && sha256sum "$PACKAGE_NAME") > SHA256SUMS
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$PACKAGE" SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$PACKAGE" SHA256SUMS \
              --generate-notes \
              --notes "Verified Ploff release for legacy LG webOS TVs. Includes the generic IPK and SHA-256 checksums." \
              --title "Ploff $GITHUB_REF_NAME"
          fi

  publish-image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Verify version tag
        run: |
          APP_VERSION=$(node -p "require('./webos-shell-app/appinfo.json').version")
          test "$GITHUB_REF_NAME" = "v$APP_VERSION"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/ploff-webos-installer
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
