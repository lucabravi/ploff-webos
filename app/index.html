<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ploff</title>
  <link rel="stylesheet" href="styles.css?v=dev">
</head>
<body class="is-booting">
  <section id="startup-splash" class="startup-splash" aria-live="polite">
    <img class="startup-splash-logo" src="ploff-logo.svg" alt="Ploff">
    <div class="startup-splash-status">
      <span class="startup-splash-spinner" aria-hidden="true"></span>
      <span id="startup-splash-label">Loading...</span>
    </div>
  </section>
  <div class="backdrop" aria-hidden="true">
    <img id="backdrop-a" class="backdrop-image is-active" alt="">
    <img id="backdrop-b" class="backdrop-image" alt="">
    <div class="backdrop-shade"></div>
  </div>
  <header class="topbar">
    <div class="brand"><img class="brand-logo" src="ploff-logo.svg" alt="Ploff"></div>
    <nav id="navigation" class="navigation" aria-label="Main navigation"></nav>
    <div class="topbar-status">
      <button id="server-activity" class="server-activity is-idle" type="button" data-activity-shortcut="true" aria-expanded="false">
        <span class="server-activity-spinner processing-orb" aria-hidden="true">
          <span class="processing-orb-legacy">
            <span class="legacy-orbit legacy-orbit-a"></span>
            <span class="legacy-orbit legacy-orbit-b"></span>
            <span class="legacy-orb-core"></span>
            <span class="legacy-orb-spark legacy-orb-spark-a"></span>
            <span class="legacy-orb-spark legacy-orb-spark-b"></span>
          </span>
          <svg class="processing-orb-ring" viewBox="0 0 100 100" focusable="false">
            <circle class="idle-ring" cx="50" cy="50" r="46"></circle>
          </svg>
          <svg class="processing-orb-active" viewBox="0 0 100 100" focusable="false">
            <defs>
              <clipPath id="server-activity-orb-clip"><circle cx="50" cy="50" r="45"></circle></clipPath>
              <linearGradient id="server-activity-status-gradient-online" x1="6" y1="18" x2="94" y2="82">
                <stop offset="0" stop-color="#ffffff" stop-opacity=".02"></stop>
                <stop offset=".2" stop-color="#48c774" stop-opacity=".9"></stop>
                <stop offset=".46" stop-color="#ffffff" stop-opacity=".98"></stop>
                <stop offset=".7" stop-color="#48c774" stop-opacity=".9"></stop>
                <stop offset="1" stop-color="#48c774" stop-opacity=".03"></stop>
              </linearGradient>
              <linearGradient id="server-activity-status-gradient-local-only" x1="6" y1="18" x2="94" y2="82">
                <stop offset="0" stop-color="#ffffff" stop-opacity=".02"></stop>
                <stop offset=".2" stop-color="#e5a00d" stop-opacity=".9"></stop>
                <stop offset=".46" stop-color="#ffffff" stop-opacity=".98"></stop>
                <stop offset=".7" stop-color="#e5a00d" stop-opacity=".9"></stop>
                <stop offset="1" stop-color="#e5a00d" stop-opacity=".03"></stop>
              </linearGradient>
              <linearGradient id="server-activity-status-gradient-offline" x1="6" y1="18" x2="94" y2="82">
                <stop offset="0" stop-color="#ffffff" stop-opacity=".02"></stop>
                <stop offset=".2" stop-color="#f05d5e" stop-opacity=".9"></stop>
                <stop offset=".46" stop-color="#ffffff" stop-opacity=".98"></stop>
                <stop offset=".7" stop-color="#f05d5e" stop-opacity=".9"></stop>
                <stop offset="1" stop-color="#f05d5e" stop-opacity=".03"></stop>
              </linearGradient>
              <linearGradient id="server-activity-status-gradient-unknown" x1="6" y1="18" x2="94" y2="82">
                <stop offset="0" stop-color="#ffffff" stop-opacity=".02"></stop>
                <stop offset=".2" stop-color="#737a84" stop-opacity=".9"></stop>
                <stop offset=".46" stop-color="#ffffff" stop-opacity=".98"></stop>
                <stop offset=".7" stop-color="#737a84" stop-opacity=".9"></stop>
                <stop offset="1" stop-color="#737a84" stop-opacity=".03"></stop>
              </linearGradient>
              <linearGradient id="server-activity-purple-gradient" x1="8" y1="15" x2="92" y2="85">
                <stop offset="0" stop-color="#d8b4ff" stop-opacity=".04"></stop>
                <stop offset=".23" stop-color="#dcbcff" stop-opacity=".94"></stop>
                <stop offset=".48" stop-color="#ffffff" stop-opacity=".98"></stop>
                <stop offset=".72" stop-color="#c797ff" stop-opacity=".9"></stop>
                <stop offset="1" stop-color="#d8b4ff" stop-opacity=".04"></stop>
              </linearGradient>
              <radialGradient id="server-activity-core-gradient-online">
                <stop offset="0" stop-color="#ffffff" stop-opacity="1"></stop>
                <stop offset=".18" stop-color="#ffffff" stop-opacity=".94"></stop>
                <stop offset=".43" stop-color="#48c774" stop-opacity=".72"></stop>
                <stop offset="1" stop-color="#48c774" stop-opacity="0"></stop>
              </radialGradient>
              <radialGradient id="server-activity-core-gradient-local-only">
                <stop offset="0" stop-color="#ffffff" stop-opacity="1"></stop>
                <stop offset=".18" stop-color="#ffffff" stop-opacity=".94"></stop>
                <stop offset=".43" stop-color="#e5a00d" stop-opacity=".72"></stop>
                <stop offset="1" stop-color="#e5a00d" stop-opacity="0"></stop>
              </radialGradient>
              <radialGradient id="server-activity-core-gradient-offline">
                <stop offset="0" stop-color="#ffffff" stop-opacity="1"></stop>
                <stop offset=".18" stop-color="#ffffff" stop-opacity=".94"></stop>
                <stop offset=".43" stop-color="#f05d5e" stop-opacity=".72"></stop>
                <stop offset="1" stop-color="#f05d5e" stop-opacity="0"></stop>
              </radialGradient>
              <radialGradient id="server-activity-core-gradient-unknown">
                <stop offset="0" stop-color="#ffffff" stop-opacity="1"></stop>
                <stop offset=".18" stop-color="#ffffff" stop-opacity=".94"></stop>
                <stop offset=".43" stop-color="#737a84" stop-opacity=".72"></stop>
                <stop offset="1" stop-color="#737a84" stop-opacity="0"></stop>
              </radialGradient>
              <filter id="server-activity-fluid-filter" x="-40%" y="-40%" width="180%" height="180%">
                <feTurbulence type="fractalNoise" baseFrequency=".008 .014" numOctaves="2" seed="13" result="noise"></feTurbulence>
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="B"></feDisplacementMap>
              </filter>
              <filter id="server-activity-spark-glow" x="-300%" y="-300%" width="700%" height="700%">
                <feGaussianBlur stdDeviation="1.1" result="blur"></feGaussianBlur>
                <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
              </filter>
            </defs>
            <circle class="orb-fill" cx="50" cy="50" r="45"></circle>
            <circle class="orb-aura" cx="50" cy="50" r="42"></circle>
            <g class="activity-visual" clip-path="url(#server-activity-orb-clip)">
              <g class="fluid-field" filter="url(#server-activity-fluid-filter)">
                <g class="fluid-layer fluid-a"><path class="wave wave-glow-status wave-a" d="M-8 63 C8 15,30 13,45 43 C59 71,78 79,108 24"></path><path class="wave wave-main-status wave-a" d="M-8 63 C8 15,30 13,45 43 C59 71,78 79,108 24"></path></g>
                <g class="fluid-layer fluid-b"><path class="wave wave-glow-status wave-b" d="M-3 19 C28 20,24 62,54 79 C76 91,93 63,107 42"></path><path class="wave wave-main-status wave-b" d="M-3 19 C28 20,24 62,54 79 C76 91,93 63,107 42"></path></g>
                <g class="fluid-layer fluid-c"><path class="wave wave-glow-status wave-c" d="M-7 39 C19 83,44 5,70 27 C92 46,74 74,108 87"></path><path class="wave wave-main-status wave-c" d="M-7 39 C19 83,44 5,70 27 C92 46,74 74,108 87"></path></g>
                <g class="fluid-layer fluid-d"><path class="wave wave-glow-status wave-d" d="M-10 50 C17 8,40 20,52 46 C64 72,84 66,110 37"></path><path class="wave wave-main-status wave-d" d="M-10 50 C17 8,40 20,52 46 C64 72,84 66,110 37"></path></g>
                <g class="fluid-layer fluid-e"><path class="wave wave-glow-status wave-e" d="M3 10 C32 21,19 56,48 68 C74 79,85 56,108 48"></path><path class="wave wave-main-status wave-e" d="M3 10 C32 21,19 56,48 68 C74 79,85 56,108 48"></path></g>
                <g class="fluid-layer fluid-p1"><path class="wave wave-glow-purple wave-p1" d="M-5 31 C17 74,44 8,67 22 C89 34,80 68,108 76"></path><path class="wave wave-main-purple wave-p1" d="M-5 31 C17 74,44 8,67 22 C89 34,80 68,108 76"></path></g>
                <g class="fluid-layer fluid-p2"><path class="wave wave-glow-purple wave-p2" d="M9 74 C23 49,43 35,58 48 C74 62,81 34,99 26"></path><path class="wave wave-main-purple wave-p2" d="M9 74 C23 49,43 35,58 48 C74 62,81 34,99 26"></path></g>
                <g class="fluid-layer fluid-p3"><path class="wave wave-glow-purple wave-p3" d="M-7 55 C19 26,35 22,51 40 C68 59,80 80,108 68"></path><path class="wave wave-main-purple wave-p3" d="M-7 55 C19 26,35 22,51 40 C68 59,80 80,108 68"></path></g>
              </g>
              <circle class="energy-pulse" cx="50" cy="50" r="30"></circle>
              <circle class="energy-pulse p2" cx="50" cy="50" r="30"></circle>
              <circle class="core" cx="50" cy="50" r="14"></circle>
              <circle class="spark s1" cx="50" cy="11" r="1.1"></circle>
              <circle class="spark s2" cx="80" cy="50" r=".9"></circle>
              <circle class="spark s3" cx="50" cy="82" r=".8"></circle>
              <circle class="spark s4" cx="21" cy="50" r=".75"></circle>
            </g>
          </svg>
        </span>
        <span id="server-activity-title" class="server-activity-title"></span>
      </button>
      <div id="server-activity-panel" class="server-activity-panel" aria-live="polite"></div>
      <button id="active-profile" class="active-profile is-hidden" type="button" data-profile-shortcut="true">
        <span class="active-profile-avatar-frame"><img id="active-profile-avatar" class="active-profile-avatar" alt=""><span id="active-profile-initial" class="active-profile-initial"></span></span>
        <span id="active-profile-name" class="active-profile-name"></span>
      </button>
      <time id="clock" class="clock"></time>
    </div>
  </header>
  <section id="setup-view" class="setup-view is-hidden" aria-live="polite">
    <div class="setup-panel">
      <div class="setup-heading">
        <img class="setup-brand" src="ploff-logo.svg" alt="Ploff">
        <span id="setup-step" class="setup-step"></span>
      </div>
      <div class="setup-title-row">
        <h1 id="setup-title" class="setup-title"></h1>
        <span id="setup-title-spinner" class="setup-title-spinner is-hidden" aria-hidden="true"></span>
      </div>
      <p id="setup-message" class="setup-message"></p>
      <div id="setup-server-list" class="setup-list"></div>
      <div id="setup-profile-list" class="setup-list is-hidden"></div>
      <div id="setup-login" class="setup-login is-hidden">
        <div class="setup-login-content">
          <img id="setup-link-qr" class="setup-link-qr" src="plex-link-qr.png" alt="Plex.tv/link QR code">
          <div class="setup-link-details">
            <a id="setup-link-url" class="setup-link-url" href="https://plex.tv/link" target="_blank">https://plex.tv/link</a>
            <div id="setup-code" class="setup-code"></div>
          </div>
        </div>
        <p id="setup-login-status" class="setup-login-status"></p>
      </div>
      <div id="setup-manual" class="setup-manual is-hidden">
        <input id="setup-address" class="setup-address" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="192.168.1.10">
      </div>
      <div id="setup-actions" class="setup-actions"></div>
    </div>
  </section>
  <main id="content" class="content"></main>

  <section id="library-view" class="library-view is-hidden">
    <div id="library-global-header" class="library-global-header">
      <h1 id="library-global-title" class="library-global-title"></h1>
      <div id="library-container-stats" class="library-container-stats is-hidden" aria-live="polite">
        <div class="library-container-stat">
          <span id="library-container-watched-label" class="library-container-stat-label"></span>
          <strong id="library-container-watched-value" class="library-container-stat-value"></strong>
        </div>
        <div class="library-container-stat">
          <span id="library-container-remaining-label" class="library-container-stat-label"></span>
          <strong id="library-container-remaining-value" class="library-container-stat-value"></strong>
        </div>
      </div>
    </div>
    <nav id="library-subnav" class="library-subnav">
      <div id="library-tabs" class="library-tabs"></div>
      <div class="library-actions">
        <button id="library-refresh" class="library-action library-refresh" type="button" title="Refresh" aria-label="Refresh"><svg class="icon-refresh-cw" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12a9 9 0 0 0-15.17-6.55L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 15.17 6.55L21 16"></path><path d="M16 16h5v5"></path></svg></button>
        <button id="library-refresh-metadata" class="library-action" type="button">Refresh metadata</button>
      </div>
    </nav>
    <div id="library-controls" class="library-controls is-hidden">
      <div id="library-sort" class="library-control-group"></div>
      <div id="library-filter" class="library-control-group"></div>
    </div>
    <div id="library-status" class="library-status"></div>
    <div id="library-recommended" class="library-recommended is-hidden"></div>
    <div id="library-grid" class="library-grid"><div id="library-grid-content" class="library-grid-content"></div></div>
    <div id="library-filter-shade" class="library-filter-shade is-hidden"></div>
    <aside id="library-filter-drawer" class="library-filter-drawer is-hidden" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="library-filter-title" aria-describedby="library-filter-hint">
      <h2 id="library-filter-title"></h2>
      <p id="library-filter-hint" class="library-filter-hint"></p>
      <div id="library-filter-rows" class="library-filter-rows"></div>
      <div class="library-filter-actions">
        <span id="library-filter-count" class="library-filter-count"></span>
        <button id="library-filter-reset" data-library-filter-action="reset" type="button"></button>
        <button id="library-filter-cancel" data-library-filter-action="cancel" type="button"></button>
        <button id="library-filter-apply" class="is-primary" data-library-filter-action="apply" type="button"></button>
      </div>
    </aside>
  </section>
  <section id="watchlist-view" class="watchlist-view is-hidden" aria-live="polite">
    <h1 id="watchlist-title" class="watchlist-title">Watchlist</h1>
    <div id="watchlist-status" class="watchlist-status"></div>
    <div id="watchlist-grid" class="watchlist-grid"><div id="watchlist-grid-content" class="watchlist-grid-content"></div></div>
  </section>
  <section id="search-view" class="search-view is-hidden" aria-live="polite">
    <div id="search-query" class="search-query"></div>
    <div id="search-t9-legend" class="search-t9-legend is-hidden" aria-hidden="true"></div>
    <div id="search-keyboard" class="search-keyboard"></div>
    <div id="search-status" class="search-status"></div>
    <div id="search-results" class="search-results"></div>
  </section>
  <section id="app-settings-view" class="app-settings-view is-hidden" aria-live="polite">
    <h1 id="app-settings-title" class="app-settings-title">Settings</h1>
    <p id="app-settings-notice" class="app-settings-notice"></p>
    <div id="app-settings-list" class="app-settings-list"></div>
    <div id="language-editor" class="language-editor is-hidden" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="language-editor-title" aria-describedby="language-editor-hint">
      <h2 id="language-editor-title"></h2>
      <p id="language-editor-hint"></p>
      <div id="language-editor-list" class="language-editor-list"></div>
      <div class="language-editor-actions"><button id="language-editor-back" type="button"></button></div>
    </div>
  </section>
  <section id="diagnostics-view" class="diagnostics-view is-hidden" aria-live="polite">
    <h1 id="diagnostics-title" class="diagnostics-title">User diagnostics</h1>
    <p id="diagnostics-notice" class="diagnostics-notice"></p>
    <div id="diagnostics-content" class="diagnostics-content"></div>
    <div class="diagnostics-actions">
      <button id="diagnostics-refresh" data-diagnostics-action="refresh" type="button">Refresh</button>
      <button id="diagnostics-back" data-diagnostics-action="back" type="button">Back</button>
    </div>
  </section>
  <section id="detail-view" class="detail-view is-hidden" aria-live="polite">
    <div id="detail-metadata-status" class="detail-metadata-status is-hidden" role="status"></div>
    <div id="season-tabs" class="season-tabs"></div>
    <div class="detail-copy">
      <h1 id="detail-title" class="detail-title"></h1>
      <div id="detail-subtitle" class="detail-subtitle"></div>
      <div id="detail-facts" class="detail-facts"></div>
      <button id="detail-summary-button" class="detail-summary-button" type="button" disabled>
        <span id="detail-summary" class="detail-summary"></span>
        <span id="detail-summary-more" class="detail-summary-more" aria-hidden="true"></span>
      </button>
      <div class="detail-actions">
        <button id="detail-play" class="detail-action" type="button">Play</button>
        <button id="detail-watched" class="detail-action detail-action-secondary" type="button">Mark watched</button>
        <button id="detail-watchlist" class="detail-action detail-action-secondary" type="button">Watchlist</button>
        <button id="detail-refresh-metadata" class="detail-action detail-action-secondary" type="button">Refresh metadata</button>
        <button id="detail-file-info" class="detail-action detail-action-secondary detail-info-action" type="button" aria-label="Media details">i</button>
      </div>
      <div id="detail-playback-controls" class="detail-playback-controls">
        <div class="detail-track-choices">
          <button id="detail-audio" class="detail-choice" type="button"><span id="detail-audio-label" class="detail-choice-label">Audio</span><span id="detail-audio-value" class="detail-choice-value"></span></button>
          <button id="detail-subtitles" class="detail-choice" type="button"><span id="detail-subtitles-label" class="detail-choice-label">Subtitles</span><span id="detail-subtitles-value" class="detail-choice-value"></span></button>
          <button id="detail-version" class="detail-choice" type="button"><span id="detail-version-label" class="detail-choice-label">Version</span><span id="detail-version-value" class="detail-choice-value"></span></button>
        </div>
      </div>
    </div>
    <img id="detail-poster" class="detail-poster" alt="">
    <div id="episode-strip" class="episode-strip"></div>
  </section>
    <div id="detail-summary-dialog" class="detail-summary-dialog is-hidden" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="detail-summary-dialog-title" aria-describedby="detail-summary-dialog-hint">
      <div class="detail-summary-dialog-panel">
        <h2 id="detail-summary-dialog-title"></h2>
        <div id="detail-summary-dialog-text" class="detail-summary-dialog-text"></div>
        <div id="detail-summary-dialog-hint" class="detail-summary-dialog-hint"></div>
        <button id="detail-summary-dialog-close" class="detail-summary-dialog-close" type="button"></button>
      </div>
    </div>
    <div id="media-info-dialog" class="media-info-dialog is-hidden" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="media-info-dialog-title" aria-describedby="media-info-dialog-hint">
      <div class="media-info-dialog-panel">
        <h2 id="media-info-dialog-title"></h2>
        <div id="media-info-dialog-content" class="media-info-dialog-content"></div>
        <div id="media-info-dialog-hint" class="media-info-dialog-hint"></div>
        <button id="media-info-dialog-close" class="media-info-dialog-close" type="button"></button>
      </div>
    </div>
    <div id="choice-dialog" class="choice-dialog is-hidden" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="choice-dialog-title">
      <div class="choice-dialog-panel">
        <h3 id="choice-dialog-title"></h3>
        <div id="choice-dialog-list" class="choice-dialog-list"></div>
        <div class="choice-dialog-actions"><button id="choice-dialog-cancel" type="button"></button></div>
      </div>
    </div>
    <div id="up-next-layout-dialog" class="up-next-layout-dialog is-hidden" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="up-next-layout-title">
      <div class="up-next-layout-panel">
        <h3 id="up-next-layout-title"></h3>
        <div class="up-next-layout-options">
          <button type="button" class="up-next-layout-option" data-up-next-layout="compact">
            <span class="up-next-layout-preview is-compact" aria-hidden="true"><span class="preview-brand">Ploff</span><span class="preview-card"><i id="up-next-preview-compact-heading">UP NEXT</i><b>S1 E5</b><em></em></span><span class="preview-timeline"></span></span>
            <strong id="up-next-layout-compact-label"></strong>
          </button>
          <button type="button" class="up-next-layout-option" data-up-next-layout="bottom-panel">
            <span class="up-next-layout-preview is-bottom" aria-hidden="true"><span class="preview-brand">Ploff</span><span class="preview-card"><i id="up-next-preview-bottom-heading">UP NEXT</i><b id="up-next-preview-bottom-episode">S1 E5 - NEXT EPISODE</b></span><span class="preview-timeline"></span></span>
            <strong id="up-next-layout-bottom-label"></strong>
          </button>
        </div>
        <div class="up-next-layout-actions"><button id="up-next-layout-cancel" type="button"></button><button id="up-next-layout-apply" type="button"></button></div>
      </div>
    </div>
    <div id="update-dialog" class="update-dialog is-hidden" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="update-dialog-title" aria-describedby="update-status update-release-hint">
      <div class="update-dialog-panel">
        <h2 id="update-dialog-title"></h2>
        <div class="update-dialog-body">
          <div class="update-dialog-copy">
            <dl class="update-dialog-details">
              <div><dt id="update-installed-label"></dt><dd id="update-installed-value"></dd></div>
              <div><dt id="update-latest-label"></dt><dd id="update-latest-value"></dd></div>
              <div><dt id="update-last-check-label"></dt><dd id="update-last-check-value"></dd></div>
            </dl>
            <p id="update-status" class="update-dialog-status"></p>
            <p id="update-release-hint" class="update-dialog-hint"></p>
          </div>
          <img class="update-dialog-qr" src="ploff-release-qr.png" alt="" aria-hidden="true">
        </div>
        <div class="update-dialog-actions"><button id="update-check" class="is-primary" data-update-index="0" type="button"></button><button id="update-close" data-update-index="1" type="button"></button></div>
      </div>
    </div>
    <div id="privacy-dialog" class="privacy-dialog is-hidden" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="privacy-dialog-title" aria-describedby="privacy-dialog-content">
      <div class="privacy-dialog-panel">
        <h2 id="privacy-dialog-title"></h2>
        <div id="privacy-dialog-content" class="privacy-dialog-content"></div>
        <button id="privacy-dialog-close" class="privacy-dialog-close" type="button"></button>
      </div>
    </div>
  <section id="player-view" class="player-view is-hidden">
    <img id="autoplay-backdrop" class="player-up-next-backdrop" alt="" aria-hidden="true">
    <video id="player-video" class="player-video" playsinline autoplay></video>
