<!doctype html>
<meta charset="utf-8">
<title>Ploff ASS WASM browser test</title>
<style>
  body { margin: 0; background: #111; color: #fff; font: 20px sans-serif; }
  canvas { width: 1280px; height: 720px; background: #18202b; }
  pre { position: fixed; left: 20px; top: 20px; background: rgba(0,0,0,.8); padding: 12px; }
</style>
<canvas id="ass" width="1280" height="720"></canvas>
<pre id="status">Starting…</pre>
<script src="../app/vendor/subtitles-octopus.js"></script>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('ass');
  var status = document.getElementById('status');
  var started = performance.now();
  var phases = [];
  var result = window.PloffAssWasmBrowserResult = {
    complete: false, wasmSupported: typeof WebAssembly === 'object', workerUrl: '',
    readyMs: null, firstFrameMs: null, secondFrameMs: null, barrierMs: null,
    firstPixels: 0, secondPixels: 0, phases: phases, errors: []
  };
  function ass(text, color, start, end) {
    return '[Script Info]\nScriptType: v4.00+\nPlayResX: 1280\nPlayResY: 720\n' +
      '[V4+ Styles]\nFormat: Name,Fontname,Fontsize,PrimaryColour,SecondaryColour,OutlineColour,BackColour,Bold,Italic,Underline,StrikeOut,ScaleX,ScaleY,Spacing,Angle,BorderStyle,Outline,Shadow,Alignment,MarginL,MarginR,MarginV,Encoding\n' +
      'Style: Default,Arial,72,' + color + ',&H000000FF,&H00000000,&H00000000,0,0,0,0,100,100,0,0,1,3,0,2,10,10,70,1\n' +
      '[Events]\nFormat: Layer,Start,End,Style,Name,MarginL,MarginR,MarginV,Effect,Text\n' +
      'Dialogue: 0,' + start + ',' + end + ',Default,,0,0,0,,' + text + '\n';
  }
  function opaquePixels() {
    var data = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;
    var count = 0; var index;
    for (index = 3; index < data.length; index += 4) { if (data[index]) { count += 1; } }
    return count;
  }
  function show() { status.textContent = JSON.stringify(result, null, 2); }
  function fail(error) { result.errors.push(String(error && error.message || error)); show(); }
  var renderer = new SubtitlesOctopus({
    canvas: canvas,
    workerUrl: '../app/vendor/subtitles-octopus-worker.js?v=browser-test',
    legacyWorkerUrl: '../app/vendor/subtitles-octopus-worker-legacy.js?v=browser-test',
    fallbackFont: 'default.ttf', renderMode: 'js-blend',
    subContent: ass('PLOFF WASM FRAME ONE', '&H00FFFFFF', '0:00:00.00', '0:00:10.00'),
    onTiming: function (phase) { phases.push(phase); show(); },
    onError: fail,
    onReady: function () {
      result.readyMs = performance.now() - started;
      result.workerUrl = renderer.workerUrl;
      renderer.setIsPaused(true, 1);
      show();
    }
  });
  var stage = 0;
  var timer = setInterval(function () {
    var pixels = opaquePixels();
    if (stage === 0 && pixels > 0) {
      result.firstPixels = pixels; result.firstFrameMs = performance.now() - started; stage = 1;
      renderer.setTrack(ass('PLOFF WASM FRAME TWO', '&H0000FF00', '0:00:10.00', '0:00:20.00'));
      renderer.releaseWorkerFramesAt(12, true, function () {
        result.barrierMs = performance.now() - started; show();
      });
    } else if (stage === 1 && result.barrierMs !== null && pixels > 0) {
      result.secondPixels = pixels; result.secondFrameMs = performance.now() - started;
      result.complete = true; stage = 2; clearInterval(timer); show();
    }
    if (performance.now() - started > 15000 && !result.complete) {
      clearInterval(timer); fail('browser test timeout');
    }
  }, 50);
  show();
}());
</script>
